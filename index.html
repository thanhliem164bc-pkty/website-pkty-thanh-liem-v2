<!-- ==================================================
     GALLERY SLIDESHOW / IMAGE + VIDEO
     PKTY THANH LIÊM
================================================== -->

<script>

let galleryItems = [];

let galleryIndex = 0;

let galleryTimer = null;

const GALLERY_INTERVAL = 4000;


/* ==================================================
   LOAD GALLERY
================================================== */

async function loadGallery(){

  const gallery =
    document.getElementById(
      "galleryGrid"
    );


  if(!gallery){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/gallery",
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Không tải được gallery"
      );

    }


    const media =
      await response.json();


    /*
      ẢNH MẶT TIỀN CỐ ĐỊNH
      Luôn nằm đầu slideshow
    */

    galleryItems = [

      {
        type:"image",

        url:
          "mat-tien-phong-kham.jpg",

        fixed:true
      }

    ];


    /*
      THÊM ẢNH / VIDEO UPLOAD

      /api/gallery đã trả về
      đúng thứ tự được lưu
      trong admin.
    */

    if(
      Array.isArray(media)
    ){

      media.forEach(
        function(item){

          if(
            !item ||
            !item.url
          ){

            return;

          }


          galleryItems.push({

            type:
              item.type === "video"
                ? "video"
                : "image",

            url:
              String(
                item.url
              ),

            filename:
              item.filename || ""

          });

        }
      );

    }


    /*
      KHÔNG CÓ MEDIA
    */

    if(
      galleryItems.length === 0
    ){

      gallery.innerHTML = `

        <div class="gallery-empty">

          <div style="font-size:42px">
            🐾
          </div>

          <b>
            Hình ảnh & video đang được cập nhật
          </b>

          <br>

          <span>
            Phòng khám sẽ cập nhật thêm những khoảnh khắc mới.
          </span>

        </div>

      `;

      return;

    }


    /*
      TẠO GIAO DIỆN SLIDESHOW
    */

    gallery.innerHTML = `

      <div
        class="gallery-slider"
        id="gallerySlider"
      >

        <button
          type="button"
          class="gallery-arrow gallery-prev"
          id="galleryPrev"
          aria-label="Ảnh trước"
        >
          ‹
        </button>


        <div
          class="gallery-slide"
          id="gallerySlide"
        ></div>


        <button
          type="button"
          class="gallery-arrow gallery-next"
          id="galleryNext"
          aria-label="Ảnh tiếp theo"
        >
          ›
        </button>


        <div
          class="gallery-dots"
          id="galleryDots"
        ></div>

      </div>

    `;


    /*
      TẠO DOTS
    */

    createGalleryDots();


    /*
      HIỆN SLIDE ĐẦU TIÊN
    */

    showGallerySlide(
      0
    );


    /*
      NÚT PREVIOUS
    */

    const prevButton =
      document.getElementById(
        "galleryPrev"
      );


    if(prevButton){

      prevButton.addEventListener(
        "click",
        function(){

          prevGallerySlide();

        }
      );

    }


    /*
      NÚT NEXT
    */

    const nextButton =
      document.getElementById(
        "galleryNext"
      );


    if(nextButton){

      nextButton.addEventListener(
        "click",
        function(){

          nextGallerySlide();

        }
      );

    }


    /*
      TẠM DỪNG KHI RÊ CHUỘT
    */

    const slider =
      document.getElementById(
        "gallerySlider"
      );


    if(slider){

      slider.addEventListener(
        "mouseenter",
        function(){

          stopGalleryAutoPlay();

        }
      );


      slider.addEventListener(
        "mouseleave",
        function(){

          startGalleryAutoPlay();

        }
      );


      /*
        MOBILE:
        chạm vào thì tạm dừng
      */

      slider.addEventListener(
        "touchstart",
        function(){

          stopGalleryAutoPlay();

        },
        {
          passive:true
        }
      );


      slider.addEventListener(
        "touchend",
        function(){

          startGalleryAutoPlay();

        },
        {
          passive:true
        }
      );

    }


  }catch(error){

    console.error(
      "Gallery error:",
      error
    );


    gallery.innerHTML = `

      <div class="gallery-empty">

        <div style="font-size:42px">
          🐾
        </div>

        <b>
          Không thể tải hình ảnh
        </b>

        <br>

        <span>
          Vui lòng thử lại sau.
        </span>

      </div>

    `;

  }

}


/* ==================================================
   HIỆN SLIDE
================================================== */

function showGallerySlide(
  index
){

  const slide =
    document.getElementById(
      "gallerySlide"
    );


  if(!slide){

    return;

  }


  if(
    !galleryItems.length
  ){

    return;

  }


  /*
    QUAY VÒNG
  */

  if(
    index < 0
  ){

    index =
      galleryItems.length - 1;

  }


  if(
    index >=
    galleryItems.length
  ){

    index = 0;

  }


  galleryIndex =
    index;


  /*
    DỪNG VIDEO CŨ
  */

  const oldVideo =
    slide.querySelector(
      "video"
    );


  if(oldVideo){

    try{

      oldVideo.pause();

      oldVideo.currentTime = 0;

    }catch(error){}

  }


  /*
    XÓA TIMER CŨ
  */

  stopGalleryAutoPlay();


  const item =
    galleryItems[
      galleryIndex
    ];


  /*
    ================================================
    VIDEO
    ================================================
  */

  if(
    item.type === "video"
  ){

    slide.innerHTML = `

      <div
        class="gallery-media-wrap"
      >

        <video
          class="gallery-media gallery-video"
          autoplay
          muted
          playsinline
          preload="metadata"
        >

          <source
            src="${item.url}"
          >

          Trình duyệt của bạn không hỗ trợ video.

        </video>


        <span
          class="gallery-video-badge"
        >
          ▶ VIDEO
        </span>

      </div>

    `;


    const video =
      slide.querySelector(
        "video"
      );


    if(video){

      /*
        VIDEO CHẠY HẾT
        -> CHUYỂN SLIDE TIẾP
      */

      video.addEventListener(
        "ended",
        function(){

          nextGallerySlide();

        }
      );


      /*
        NẾU VIDEO LỖI
        -> CHUYỂN SLIDE SAU 4 GIÂY
      */

      video.addEventListener(
        "error",
        function(){

          galleryTimer =
            setTimeout(
              function(){

                nextGallerySlide();

              },
              GALLERY_INTERVAL
            );

        }
      );


      /*
        AUTOPLAY
      */

      const playPromise =
        video.play();


      if(
        playPromise &&
        typeof playPromise.catch ===
          "function"
      ){

        playPromise.catch(
          function(){

            /*
              Một số trình duyệt có thể
              chặn autoplay.

              Hiện tại video vẫn có
              nút điều khiển của trình duyệt
              nếu cần.
            */

          }
        );

      }

    }

  }


  /*
    ================================================
    IMAGE
    ================================================
  */

  else{

    slide.innerHTML = `

      <div
        class="gallery-media-wrap"
      >

        <img
          class="gallery-media gallery-image"
          src="${item.url}"
          alt="Ảnh tại PKTY Thanh Liêm"
          loading="eager"
        >

      </div>

    `;


    /*
      ẢNH:
      tự chuyển sau 4 giây
    */

    galleryTimer =
      setTimeout(
        function(){

          nextGallerySlide();

        },
        GALLERY_INTERVAL
      );

  }


  /*
    CẬP NHẬT DOT
  */

  updateGalleryDots();

}


/* ==================================================
   NEXT SLIDE
================================================== */

function nextGallerySlide(){

  if(
    !galleryItems.length
  ){

    return;

  }


  galleryIndex++;


  if(
    galleryIndex >=
    galleryItems.length
  ){

    galleryIndex = 0;

  }


  showGallerySlide(
    galleryIndex
  );

}


/* ==================================================
   PREVIOUS SLIDE
================================================== */

function prevGallerySlide(){

  if(
    !galleryItems.length
  ){

    return;

  }


  galleryIndex--;


  if(
    galleryIndex < 0
  ){

    galleryIndex =
      galleryItems.length - 1;

  }


  showGallerySlide(
    galleryIndex
  );

}


/* ==================================================
   TẠO DOTS
================================================== */

function createGalleryDots(){

  const dots =
    document.getElementById(
      "galleryDots"
    );


  if(!dots){

    return;

  }


  dots.innerHTML = "";


  galleryItems.forEach(
    function(item,index){

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "gallery-dot";


      button.setAttribute(
        "aria-label",
        `Xem slide ${index + 1}`
      );


      button.addEventListener(
        "click",
        function(){

          showGallerySlide(
            index
          );

        }
      );


      dots.appendChild(
        button
      );

    }
  );

}


/* ==================================================
   CẬP NHẬT DOT
================================================== */

function updateGalleryDots(){

  const dots =
    document.querySelectorAll(
      ".gallery-dot"
    );


  dots.forEach(
    function(dot,index){

      if(
        index ===
        galleryIndex
      ){

        dot.classList.add(
          "active"
        );

      }else{

        dot.classList.remove(
          "active"
        );

      }

    }
  );

}


/* ==================================================
   START AUTO PLAY
================================================== */

function startGalleryAutoPlay(){

  /*
    Nếu đang ở video:
    KHÔNG dùng timer.

    Video sẽ tự chuyển
    khi chạy hết.
  */

  const item =
    galleryItems[
      galleryIndex
    ];


  if(
    item &&
    item.type === "video"
  ){

    return;

  }


  stopGalleryAutoPlay();


  if(
    galleryItems.length <= 1
  ){

    return;

  }


  galleryTimer =
    setTimeout(
      function(){

        nextGallerySlide();

      },
      GALLERY_INTERVAL
    );

}


/* ==================================================
   STOP AUTO PLAY
================================================== */

function stopGalleryAutoPlay(){

  if(
    galleryTimer
  ){

    clearTimeout(
      galleryTimer
    );

    galleryTimer =
      null;

  }

}


/* ==================================================
   KHI TAB KHÔNG HIỂN THỊ
================================================== */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.hidden
    ){

      stopGalleryAutoPlay();

    }else{

      const item =
        galleryItems[
          galleryIndex
        ];


      /*
        Nếu đang ở ảnh
        thì chạy lại timer.

        Nếu đang video
        thì không ép chuyển.
      */

      if(
        item &&
        item.type === "image"
      ){

        startGalleryAutoPlay();

      }

    }

  }
);


/* ==================================================
   LOAD KHI TRANG ĐÃ SẴN SÀNG
================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadGallery();

  }
);

</script>
