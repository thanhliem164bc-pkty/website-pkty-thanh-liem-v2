<!-- ==================================================
     GALLERY / VIDEO LOADER
================================================== -->

<script>

async function loadGallery(){

  const gallery =
    document.getElementById(
      "galleryGrid"
    );


  if(!gallery){
    return;
  }


  try{

    const response =
      await fetch(
        "/api/gallery",
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Không tải được gallery"
      );

    }


    const media =
      await response.json();


    let html = "";


    /*
      Ảnh mặt tiền cố định
    */

    html += `

      <a
        class="gallery-card gallery-feature"
        href="mat-tien-phong-kham.jpg"
        target="_blank"
        rel="noopener"
      >

        <img
          src="mat-tien-phong-kham.jpg"
          alt="Mặt tiền Phòng khám Thú y PKTY Thanh Liêm"
        >

        <span class="media-label">
          📷 Phòng khám
        </span>

      </a>

    `;


    /*
      Nếu chưa có media upload
    */

    if(
      !Array.isArray(media) ||
      media.length === 0
    ){

      gallery.innerHTML =
        html +
        `

          <div class="gallery-empty">

            <div style="font-size:42px">
              🐾
            </div>

            <b>
              Hình ảnh & video đang được cập nhật
            </b>

            <br>

            <span>
              Phòng khám sẽ cập nhật thêm những khoảnh khắc mới.
            </span>

          </div>

        `;

      return;

    }


    /*
      Render từng ảnh/video
    */

    media.forEach(
      function(item){

        if(
          !item ||
          !item.url
        ){

          return;

        }


        const url =
          String(
            item.url
          );

        const type =
          item.type;


        /*
          VIDEO
        */

        if(
          type === "video"
        ){

          html += `

            <div
              class="gallery-card"
            >

              <span class="video-badge">
                ▶ VIDEO
              </span>

              <video
                controls
                preload="metadata"
                playsinline
              >

                <source
                  src="${url}"
                >

                Trình duyệt của bạn không hỗ trợ video.

              </video>

            </div>

          `;

          return;

        }


        /*
          IMAGE
        */

        html += `

          <a
            class="gallery-card"
            href="${url}"
            target="_blank"
            rel="noopener"
          >

            <img
              src="${url}"
              alt="Ảnh tại PKTY Thanh Liêm"
              loading="lazy"
            >

          </a>

        `;

      }
    );


    gallery.innerHTML =
      html;


  }catch(error){

    console.error(
      "Gallery error:",
      error
    );

  }

}


/*
  Chờ trang tải xong
*/

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadGallery();

  }
);

</script>
